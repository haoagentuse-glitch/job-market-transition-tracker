x-base: &base
  build: .
  image: jobshift:latest
  volumes:
    - ./data:/data
    - ./jobshift:/app/jobshift          # 改程式不用重 build
  environment:
    JOBSHIFT_DATA_DIR: /data
    TZ: Asia/Taipei
  working_dir: /app

x-gpu: &gpu
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: 1
            capabilities: [gpu]

services:
  # ── 主入口：跑一次完整的快照更新（每一兩個月一次）──────────────────
  #   docker compose run --rm pipeline
  #   斷了就把同一行再跑一次，已完成的階段會自動跳過。

  pipeline:
    <<: [*base, *gpu]
    profiles: ["batch"]
    # 只列變數名不給值＝有設才傳進去。寫成 "${X:-預設}" 會讓 compose 也持有一份
    # 預設值，跟 settings.py 那份各走各的 —— 實際踩過：settings 寫 3 秒、
    # compose 還留著舊的 1 秒，結果爬蟲用 1 秒跑，被擋了才發現。
    environment:
      - JOBSHIFT_DATA_DIR=/data
      - JOBSHIFT_SNAPSHOT_DATE
      - CRAWL_MAX_PAGES
      - CRAWL_ABORT_AFTER_403
      - CRAWL_SLEEP_PAGE_MIN
      - CRAWL_SLEEP_PAGE_MAX
      - CRAWL_SLEEP_RUN_MIN
      - CRAWL_SLEEP_RUN_MAX
      - CRAWL_SLEEP_CAT_MIN
      - CRAWL_SLEEP_CAT_MAX
      - CRAWL_MAX_RUNS
    command: python -m jobshift.pipeline

  # ── 單獨跑某個階段：debug 或只想重算分析時用 ────────────────────────

  crawl:                     # 長任務 ①：爬取現在這個時刻的快照
    <<: *base
    profiles: ["batch"]
    environment:
      - JOBSHIFT_DATA_DIR=/data
      - JOBSHIFT_SNAPSHOT_DATE
      - CRAWL_MAX_PAGES
      - CRAWL_ABORT_AFTER_403
      - CRAWL_SLEEP_PAGE_MIN
      - CRAWL_SLEEP_PAGE_MAX
      - CRAWL_SLEEP_RUN_MIN
      - CRAWL_SLEEP_RUN_MAX
      - CRAWL_SLEEP_CAT_MIN
      - CRAWL_SLEEP_CAT_MAX
      - CRAWL_MAX_RUNS
    command: python -m jobshift.crawler

  ingest:                    # 短任務：原始資料 → 清洗 → DuckDB
    <<: *base
    profiles: ["batch"]
    command: python -m jobshift.ingest --all

  embed:                     # 長任務 ②：bge-m3 向量化（GPU）
    <<: [*base, *gpu]
    profiles: ["batch"]
    command: python -m jobshift.embed --all

  analyze:                   # 中任務：分群 → 跨期指派 → 遷移 → DuckDB
    <<: [*base, *gpu]        # kNN 是 13 萬 × 13 萬的矩陣乘法，有 GPU 就用
    profiles: ["batch"]
    command: python -m jobshift.analyze

  # ── 常駐服務：docker compose up -d ────────────────────────────────

  api:
    <<: *base
    command: uvicorn jobshift.api:app --host 0.0.0.0 --port 8000
    ports:
      # 對外埠可換：這台機器的 8000 被 Docker Desktop 自己佔著。
      # 容器內固定 8000，所以 dashboard 連的 http://api:8000 不受影響。
      - "${JOBSHIFT_API_PORT:-8010}:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  dashboard:
    <<: *base
    environment:
      JOBSHIFT_DATA_DIR: /data
      JOBSHIFT_API: http://api:8000
    command: >
      streamlit run jobshift/dashboard.py
      --server.port=8501 --server.address=0.0.0.0
      --server.headless=true --browser.gatherUsageStats=false
    ports:
      - "${JOBSHIFT_UI_PORT:-8501}:8501"
    depends_on:
      api:
        condition: service_healthy
