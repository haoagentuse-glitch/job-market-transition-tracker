[project]
name = "jobshift"
version = "1.0.0"
description = "職缺市場的語意結構跨期遷移分析"
readme = "README.md"
requires-python = ">=3.12,<3.13"

dependencies = [
    # 爬取。刻意不用 Scrapy：實測它的連續請求模式會被來源站封鎖 IP，
    # 而前一版的 requests 序列＋三層節流抓完 6.5 萬筆從未被擋。詳見 crawler.py 檔頭。
    "requests>=2.32,<3",
    # 資料處理 / 儲存
    "pandas>=2.2,<3",
    "numpy>=1.26,<2.2",          # 上限來自 numba/umap-learn
    "pyarrow>=18,<19",
    "duckdb>=1.1,<2",
    # 向量與分群（無 jieba，全 embedding 驅動）
    "torch>=2.5,<3",
    "sentence-transformers>=3.3,<4",
    "scikit-learn>=1.5,<2",      # HDBSCAN 自 1.3 起內建，不需要額外套件
    "umap-learn>=0.5.7,<0.6",
    # 服務層
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.34,<0.35",
    "httpx>=0.28,<0.29",
    # 儀表板
    "streamlit>=1.41,<2",
    "plotly>=5.24,<6",
]

[dependency-groups]
dev = ["ruff>=0.8,<0.9"]

# torch 走 PyPI 的 CPU wheel 會少 CUDA runtime，這裡明確指到 cu124 索引。
[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu124" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jobshift"]

# ── ruff ────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "UP",        # pyupgrade
    "B",         # bugbear
    "SIM",       # simplify
    "RUF",       # ruff 自有規則
]
ignore = [
    "RUF001", "RUF002", "RUF003",  # 中文全形標點會被誤判為 ambiguous unicode
    "E501",                        # 長度交給 formatter，不當錯誤擋
]

[tool.ruff.format]
quote-style = "double"
